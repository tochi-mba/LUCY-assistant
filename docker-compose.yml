# LUCY-assistant family. The hub and the published services, one network.
#
# Operator-local services belong in docker-compose.override.yml (gitignored).
# Compose merges that file automatically. See docs/private-repos.md.
#
# Paths are ./<Repo> because this file lives beside the service checkouts.
#   python scripts/genenv.py
#   make images && make up
# Host and container ports match the family assignments (8000-8009; see docs/adr/0010).

name: lucy-family

networks:
  lucy:
    name: lucy-family

volumes:
  lucy-data:
  keyring-data:
  user-data:
  settings-data:
  persona-data:
  memory-data:
  environments-data:

# Build-time only. Never put GITHUB_TOKEN in .env.family: env_file is passed
# to every running container, and none of them needs a GitHub credential.
secrets:
  github_token:
    environment: GITHUB_TOKEN

services:
  # The front door. It is built from this repository, not from a sibling checkout, because
  # the hub lives here (docs/adr/0009-the-hub-lives-here.md).
  lucy:
    build:
      context: .
      secrets: [github_token]
    ports:
      - "8000:8000"
    env_file:
      - .env.family
    environment:
      LUCY_HOST: "0.0.0.0"
      LUCY_PORT: "8000"
      LUCY_AUDIENCE: lucy-api
      LUCY_KEYRING_BASE_URL: http://keyring:8001
      LUCY_KEYRING_JWKS_URL: http://keyring:8001/.well-known/jwks.json
      LUCY_KEYRING_ISSUER: "http://127.0.0.1:8001"
      LUCY_USER_API_BASE_URL: http://user:8002
      LUCY_SETTINGS_API_BASE_URL: http://settings:8003
      LUCY_PERSONA_API_BASE_URL: http://persona:8004
      LUCY_WEB_SEARCH_BASE_URL: http://web-search:8006
      LUCY_SPOTIFY_API_BASE_URL: http://spotify:8007
      LUCY_ENVIRONMENTS_API_BASE_URL: http://environments:8008
      LUCY_MEMORY_API_BASE_URL: http://memory:8009
      LUCY_LOG_FORMAT: json
    volumes:
      - lucy-data:/var/lib/lucy
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  keyring:
    build:
      context: ./Keyring-api
      secrets: [github_token]
    ports:
      - "8001:8001"
    env_file:
      - .env.family
    environment:
      KEYRING_HOST: "0.0.0.0"
      KEYRING_PORT: "8001"
      KEYRING_ISSUER: "http://127.0.0.1:8001"
      KEYRING_DATABASE_PATH: /var/lib/keyring/keyring.db
      KEYRING_SIGNING_KEY_PATH: /var/lib/keyring/keys/signing.pem
      KEYRING_LOG_FORMAT: json
    volumes:
      - keyring-data:/var/lib/keyring
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [lucy]

  user:
    build:
      context: ./User-api
      secrets: [github_token]
    ports:
      - "8002:8002"
    env_file:
      - .env.family
    environment:
      USER_API_HOST: "0.0.0.0"
      USER_API_PORT: "8002"
      USER_API_DATABASE_PATH: /var/lib/user-api/user.db
      USER_API_KEYRING_JWKS_URL: http://keyring:8001/.well-known/jwks.json
      USER_API_KEYRING_ISSUER: "http://127.0.0.1:8001"
      USER_API_LOG_FORMAT: json
    volumes:
      - user-data:/var/lib/user-api
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  settings:
    build:
      context: ./Settings-api
      secrets: [github_token]
    ports:
      - "8003:8003"
    env_file:
      - .env.family
    environment:
      SETTINGS_API_HOST: "0.0.0.0"
      SETTINGS_API_PORT: "8003"
      SETTINGS_API_DATABASE_PATH: /var/lib/settings-api/settings.db
      SETTINGS_API_KEYRING_JWKS_URL: http://keyring:8001/.well-known/jwks.json
      SETTINGS_API_KEYRING_ISSUER: "http://127.0.0.1:8001"
      SETTINGS_API_LOG_FORMAT: json
    volumes:
      - settings-data:/var/lib/settings-api
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  persona:
    build:
      context: ./Persona-api
      secrets: [github_token]
    ports:
      - "8004:8004"
    env_file:
      - .env.family
    environment:
      PERSONA_HOST: "0.0.0.0"
      PERSONA_PORT: "8004"
      PERSONA_DATABASE_PATH: /var/lib/persona/persona.db
      PERSONA_KEYRING_JWKS_URL: http://keyring:8001/.well-known/jwks.json
      PERSONA_KEYRING_ISSUER: "http://127.0.0.1:8001"
      PERSONA_LOG_FORMAT: json
    volumes:
      - persona-data:/var/lib/persona
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  memory:
    build:
      context: ./Memory-api
      secrets: [github_token]
    ports:
      - "8009:8009"
    env_file:
      - .env.family
    environment:
      MEMORY_HOST: "0.0.0.0"
      MEMORY_PORT: "8009"
      MEMORY_DATABASE_PATH: /var/lib/memory/memory.db
      MEMORY_KEYRING_JWKS_URL: http://keyring:8001/.well-known/jwks.json
      MEMORY_KEYRING_ISSUER: "http://127.0.0.1:8001"
      MEMORY_LOG_FORMAT: json
    volumes:
      - memory-data:/var/lib/memory
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  web-search:
    build:
      context: ./Web-search-api
      secrets: [github_token]
    ports:
      - "8006:8006"
    env_file:
      - .env.family
    environment:
      WSA_KEYRING_BASE_URL: http://keyring:8001
      WSA_KEYRING_ISSUER: "http://127.0.0.1:8001"
      WSA_KEYRING_SERVICE_NAME: web-search-api
      WSA_JSON_LOGS: "true"
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [lucy]

  spotify:
    build:
      context: ./Spotify-api
      secrets: [github_token]
    ports:
      - "8007:8007"
    env_file:
      - .env.family
    environment:
      SPOTIFY_API_KEYRING_BASE_URL: http://keyring:8001
      SPOTIFY_API_KEYRING_ISSUER: "http://127.0.0.1:8001"
      SPOTIFY_API_KEYRING_AUDIENCE: spotify-api
      SPOTIFY_API_LOG_FORMAT: json
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8007/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]

  environments:
    build:
      context: ./Environments-api
      secrets: [github_token]
    ports:
      - "8008:8008"
    privileged: true
    # The only service here that forks. A sandbox command's children outlive the shell that
    # started them, reparent to PID 1, and stay `<defunct>` until something waits on them --
    # and PID 1 is uvicorn, which never does. Measured after an afternoon of real turns: 254
    # zombie `bash` processes, at which point the sandbox answered every command with
    # `fork: Resource temporarily unavailable`. `init: true` puts tini at PID 1, whose whole
    # job is reaping what it did not start.
    init: true
    env_file:
      - .env.family
    environment:
      ENVAPI_ROOT: /var/lib/envapi
      ENVAPI_KEYRING_BASE_URL: http://keyring:8001
      ENVAPI_KEYRING_ISSUER: "http://127.0.0.1:8001"
      ENVAPI_KEYRING_SERVICE_NAME: environments-api
      ENVAPI_MIN_SANDBOX_TIER: directory
    volumes:
      - environments-data:/var/lib/envapi
    depends_on:
      keyring:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/healthy', timeout=4).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [lucy]
