# A fact given once, read back another day, then corrected: a memory's life in three turns.

summary = """\
Remember a fact, read it back in a new session, then correct it. Guards three defects: a \
fact kept as an episode of the first conversation, which the next one never sees; the \
memory index read "0 memories" for every topic (the hub read field names Memory-api never \
sends); and every notes.correct failed with a 409 because the correction dropped the note's \
scope.\
"""
tags = ["memory", "approvals"]

[[turns]]
say = "I'm a backend engineer and I review my week on Friday afternoons. Please remember that."
approve = "yes"

[turns.expect]
ran = ["notes.setFact"]

[[turns]]
say = "What do you know about me?"
new_session = true

[turns.expect]
reply_matches = ['backend|friday']
reply_avoids = ['\b0 memories']

[[turns]]
say = "Actually I review on Thursdays now. Correct that note rather than deleting it."
approve = "yes"

[turns.expect]
ran = ["notes.correct"]
not_ran = ["notes.forget"]
reply_avoids = ['\b409\b']
