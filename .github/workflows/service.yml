name: Service

on:
  workflow_call:
    secrets:
      FAMILY_GITHUB_TOKEN:
        description: Contents read access to the family repositories
        required: true
    inputs:
      python-versions:
        description: JSON list of Python versions for the test matrix
        type: string
        default: '["3.11","3.12"]'
      extras:
        description: Extra arguments passed to `uv sync` (for example `--all-extras`)
        type: string
        default: "--all-extras --group dev"
      privileged-container:
        description: Run the test job in a privileged container (Environments-api)
        type: boolean
        default: false
      live-browser-job:
        description: Run a Playwright live-browser job (Media-tool, Web-search-api)
        type: boolean
        default: false
      live-browser-marker:
        description: The pytest marker that selects the live-browser tests
        type: string
        default: live_browser
      generated-files-command:
        description: Shell that regenerates committed files; git diff --exit-code follows
        type: string
        default: ""
      docker-image-healthcheck-path:
        description: Path probed after `docker build` (liveness, not readiness)
        type: string
        default: /healthy
      run-docker:
        description: Build the Dockerfile and probe the health path
        type: boolean
        default: true
      docker-env:
        description: Newline-separated KEY=VALUE pairs the probe container boots with
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lock:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv lock --check

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - run: uv run ruff format --check .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - run: uv run ruff check --output-format=github .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - run: uv run mypy

  imports:
    name: Imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - run: uv run lint-imports

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: ${{ inputs.privileged-container && fromJSON('{"image":"python:3.11-slim","options":"--privileged"}') || fromJSON('null') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Give the privileged container git and curl
        # The slim image has neither; uv needs git for the family's client packages.
        if: ${{ inputs.privileged-container }}
        run: apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates && rm -rf /var/lib/apt/lists/*
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - name: Tests with coverage and junit
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore

  generated:
    name: Generated files
    if: ${{ inputs.generated-files-command != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - name: Regenerate and refuse drift
        run: |
          ${{ inputs.generated-files-command }}
          git diff --exit-code

  docker:
    name: Docker image
    if: ${{ inputs.run-docker }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: docker build --secret id=github_token,env=FAMILY_GITHUB_TOKEN -t service:ci .
      - name: Boot and probe the health path
        env:
          HEALTH_PATH: ${{ inputs.docker-image-healthcheck-path }}
          DOCKER_ENV: ${{ inputs.docker-env }}
        run: |
          # Each service listens on its family port (ADR-0004); the Dockerfile says which.
          port=$(grep -oE '^EXPOSE +[0-9]+' Dockerfile | awk '{print $2}' | head -1)
          test -n "$port"
          echo "$DOCKER_ENV" > probe.env
          docker run -d --name probe --env-file probe.env -p "${port}:${port}" service:ci
          for _ in $(seq 1 30); do
            curl -sf "localhost:${port}${HEALTH_PATH}" && break
            sleep 1
          done
          curl -sf "localhost:${port}${HEALTH_PATH}"
          docker rm -f probe

  audit:
    name: Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uvx pip-audit

  parity:
    name: Family parity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          repository: tochi-mba/LUCY-assistant
          token: ${{ secrets.FAMILY_GITHUB_TOKEN || github.token }}
          persist-credentials: false
          path: family
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check this repository against the family standard
        run: python family/scripts/parity.py --root . --repos-file family/repos.txt --repo ${{ github.event.repository.name }}

  live-browser:
    name: Live browser
    if: ${{ inputs.live-browser-job }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Let git read the family's private repositories
        # uv fetches the client packages with system git, so git holds the credential.
        # Empty on a public fork with no secret: git then fetches anonymously.
        env: { FAMILY_GITHUB_TOKEN: "${{ secrets.FAMILY_GITHUB_TOKEN }}" }
        run: |
          if [ -n "$FAMILY_GITHUB_TOKEN" ]; then
            git config --global url."https://x-access-token:${FAMILY_GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: uv sync ${{ inputs.extras }}
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Drive a real browser
        run: uv run pytest -m "${{ inputs.live-browser-marker }}" --no-cov -ra
