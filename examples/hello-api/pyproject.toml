[project]
name = "hello-api"
version = "0.1.0"
description = "Minimal LUCY-family FastAPI example: health probes and one authenticated route."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tochi-mba" }]
keywords = ["fastapi", "example", "keyring", "lucy"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring-client",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
hello-api = "hello_api.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/LUCY-assistant"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "cryptography>=43.0",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "EM", "ERA", "F", "FA",
    "I", "ICN", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/hello_api/api/routers/*" = ["TC001", "TC002", "TC003"]
"src/hello_api/api/dependencies.py" = ["TC001", "TC002", "TC003"]
"src/hello_api/api/errors.py" = ["TC001", "TC002", "TC003"]
"tests/**" = [
    "ARG001", "ARG002", "S101", "S105", "S106", "S107", "SLF001",
    "PLR2004", "TC001", "TC002", "TC003", "PLC0415",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["hello_api"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["keyring_client.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hello_api"]
omit = ["src/hello_api/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "hello_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers do not speak keyring directly"
type = "forbidden"
source_modules = ["hello_api.api.routers"]
forbidden_modules = ["keyring_client", "httpx", "jwt"]
allow_indirect_imports = true

[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
